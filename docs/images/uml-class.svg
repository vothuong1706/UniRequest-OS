<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1e293b" stroke-width="1.6"/>
    </marker>
    <marker id="diamondFill" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 6 L 6 2 L 12 6 L 6 10 z" fill="#1e293b"/>
    </marker>
    <g id="icon-actor">
      <circle cx="0" cy="-22" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.8"/>
      <line x1="0" y1="-13" x2="0" y2="6" stroke="#92400e" stroke-width="1.8"/>
      <line x1="-13" y1="-6" x2="13" y2="-6" stroke="#92400e" stroke-width="1.8"/>
      <line x1="0" y1="6" x2="-10" y2="21" stroke="#92400e" stroke-width="1.8"/>
      <line x1="0" y1="6" x2="10" y2="21" stroke="#92400e" stroke-width="1.8"/>
    </g>
    <g id="icon-boundary">
      <line x1="-22" y1="-15" x2="-22" y2="15" stroke="#334155" stroke-width="2"/>
      <line x1="-22" y1="0" x2="-14" y2="0" stroke="#334155" stroke-width="2"/>
      <circle cx="2" cy="0" r="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
    </g>
    <g id="icon-control">
      <circle cx="0" cy="2" r="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
      <path d="M -3 -14 L 5 -18 L 3 -10" fill="none" stroke="#334155" stroke-width="1.8"/>
    </g>
    <g id="icon-entity">
      <circle cx="0" cy="-2" r="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
      <line x1="-17" y1="16" x2="17" y2="16" stroke="#334155" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1440" height="720" fill="#ffffff"/>
  <text x="720" y="28" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">UML CLASS DIAGRAM: CÁC LỚP NGHIỆP VỤ &amp; DỊCH VỤ CỐT LÕI (BACKEND API)</text>

  <rect x="470" y="60" width="430" height="230" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="685" y="84" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">RequestEntity</text>
  <line x1="470" y1="95" x2="900" y2="95" stroke="#334155" stroke-width="1.2"/>
  <text x="484" y="116" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- id : UUID</text>
  <text x="484" y="134" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- title, description, category, priority : string</text>
  <text x="484" y="152" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- target_department : string | null</text>
  <text x="484" y="170" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- status : RequestStatus (PENDING|APPROVED|REJECTED)</text>
  <text x="484" y="188" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- created_by, workflow_execution_id : string</text>
  <text x="484" y="206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- hidden_by_sender, hidden_by_receiver : boolean</text>
  <line x1="470" y1="220" x2="900" y2="220" stroke="#334155" stroke-width="1.2"/>
  <text x="484" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ canViewRequest(user, req) : boolean</text>
  <text x="484" y="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ canReviewRequest(user, req) : boolean</text>

  <rect x="40" y="75" width="320" height="175" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="200" y="99" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">RequestCategoryEntity</text>
  <line x1="40" y1="110" x2="360" y2="110" stroke="#334155" stroke-width="1.2"/>
  <text x="54" y="132" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- id : UUID</text>
  <text x="54" y="150" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- code, name, department : string</text>
  <text x="54" y="168" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- sla_hours : number</text>
  <text x="54" y="186" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- requires_evidence, is_active : boolean</text>
  <line x1="40" y1="200" x2="360" y2="200" stroke="#334155" stroke-width="1.2"/>
  <text x="54" y="222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ toggleActive(id) / deleteMany(ids, user)</text>

  <rect x="40" y="340" width="320" height="165" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="200" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">RequestAuditLogEntity</text>
  <line x1="40" y1="375" x2="360" y2="375" stroke="#334155" stroke-width="1.2"/>
  <text x="54" y="396" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- id, request_id : UUID</text>
  <text x="54" y="414" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- actor : string | actor_roles : string[]</text>
  <text x="54" y="432" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- action : AuditAction (incl. SLA_WARNING)</text>
  <text x="54" y="450" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- metadata : Record&lt;string, unknown&gt;</text>
  <line x1="40" y1="464" x2="360" y2="464" stroke="#334155" stroke-width="1.2"/>
  <text x="54" y="486" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ recordAuditLog(params) : Promise</text>

  <rect x="450" y="360" width="460" height="190" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="680" y="384" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">RequestService</text>
  <line x1="450" y1="395" x2="910" y2="395" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="464" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ resolveRequestAccessScope(user) : RequestAccessScope</text>
  <text x="464" y="438" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ createRequest(dto, user, roles) : Promise&lt;RequestEntity&gt;</text>
  <text x="464" y="458" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ updateRequestStatus(id, status, note, actor)</text>
  <text x="464" y="478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ deleteRequests(ids, user, mode) : TwoSidedResult</text>
  <text x="464" y="498" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ getAnalytics(user) : Promise&lt;RequestAnalyticsSummary&gt;</text>

  <rect x="1020" y="75" width="375" height="205" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="1207" y="99" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Notification &amp; PushService</text>
  <line x1="1020" y1="110" x2="1395" y2="110" stroke="#334155" stroke-width="1.2"/>
  <text x="1034" y="132" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- recipient_department : string | null</text>
  <text x="1034" y="150" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- type : NotificationType | SLA_WARNING</text>
  <text x="1034" y="168" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- groups : string[] (Web Push Subscription)</text>
  <line x1="1020" y1="184" x2="1395" y2="184" stroke="#334155" stroke-width="1.2"/>
  <text x="1034" y="206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ createAndDispatch(dto) : Promise</text>
  <text x="1034" y="226" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ sendDepartmentPush(groups, payload)</text>
  <text x="1034" y="246" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ markRead / markUnread / hide(id, user)</text>

  <rect x="1020" y="340" width="375" height="165" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="1207" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">KeycloakGroup &amp; WorkflowService</text>
  <line x1="1020" y1="375" x2="1395" y2="375" stroke="#334155" stroke-width="1.2"/>
  <text x="1034" y="396" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- keycloakAdminUrl, kestraUrl : string</text>
  <text x="1034" y="414" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- webhookKey : string</text>
  <line x1="1020" y1="428" x2="1395" y2="428" stroke="#334155" stroke-width="1.2"/>
  <text x="1034" y="450" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ listGroups(forceRefresh) : DepartmentGroup[]</text>
  <text x="1034" y="470" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ dispatchLifecycleEvent(payload) : execId</text>

  <rect x="490" y="585" width="380" height="105" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="680" y="608" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">RequestCommentEntity</text>
  <line x1="490" y1="618" x2="870" y2="618" stroke="#334155" stroke-width="1.2"/>
  <text x="504" y="638" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">- id, request_id, author_username, content</text>
  <text x="504" y="658" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1e293b">+ listByRequest(id) / addComment(dto)</text>

  <line x1="360" y1="160" x2="470" y2="160" stroke="#334155" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  <text x="415" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#475569">classifies</text>
  <line x1="470" y1="260" x2="360" y2="395" stroke="#1e293b" stroke-width="1.4" marker-start="url(#diamondFill)"/>
  <text x="392" y="325" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#475569">logs 1..*</text>
  <line x1="680" y1="290" x2="680" y2="360" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  <text x="720" y="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1d4ed8">manages</text>
  <line x1="900" y1="165" x2="1020" y2="165" stroke="#334155" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  <text x="960" y="155" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#475569">triggers</text>
  <line x1="910" y1="430" x2="1020" y2="430" stroke="#334155" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  <text x="965" y="420" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#475569">uses</text>
  <line x1="680" y1="550" x2="680" y2="585" stroke="#334155" stroke-width="1.3" marker-end="url(#arrowOpen)"/>
</svg>