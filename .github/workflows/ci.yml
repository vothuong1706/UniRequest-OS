name: CI - UniRequest-OS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-quality:
    name: Frontend Clean Code & Build (Shadcn/UI + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/demo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Production Vite build
        run: npm run build

  backend-quality:
    name: Backend TypeScript Build (Express API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npm run build

      - name: Run Backend Unit & Route Tests (Vitest)
        run: npm test

  infra-and-oss-compliance:
    name: Infra, GitOps Flows & Open-Source Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config -q

      - name: Validate Keycloak Realm JSON & Kestra YAML & SVG Assets
        run: |
          python3 - <<'PY'
          import json, os, re, xml.etree.ElementTree as ET, glob

          # 1. Verify Apache-2.0 LICENSE and core OSS governance docs exist
          for req_file in ['LICENSE', 'NOTICE', 'CHANGELOG.md', 'CONTRIBUTING.md', 'SECURITY.md']:
              assert os.path.isfile(req_file), f'Missing required OSS file: {req_file}'
          assert 'Apache License' in open('LICENSE', encoding='utf-8').read()

          # 2. Validate Keycloak realm export JSON & external Seed Data JSON
          with open('config/keycloak/realm-export.json', encoding='utf-8') as f:
              realm = json.load(f)
          assert realm.get('realm') == 'unirequest'
          assert len(realm.get('groups', [])) >= 1, 'Missing default groups in realm-export.json'
          portal_client = next((c for c in realm.get('clients', []) if c.get('clientId') == 'unirequest-portal'), None)
          assert portal_client, 'Missing unirequest-portal client'
          mappers = {m.get('protocolMapper') for m in portal_client.get('protocolMappers', [])}
          assert 'oidc-group-membership-mapper' in mappers, 'Missing oidc-group-membership-mapper'

          with open('config/seed/demo-data.json', encoding='utf-8') as f:
              seed = json.load(f)
          assert len(seed.get('categories', [])) >= 10, 'Expected >= 10 seed categories'
          assert len(seed.get('requests', [])) >= 15, 'Expected >= 15 seed requests'

          with open('config/ai/assistant-config.json', encoding='utf-8') as f:
              ai_cfg = json.load(f)
          assert ai_cfg.get('prompts', {}).get('assistant_system_prompt'), 'Missing AI system prompt'
          assert len(ai_cfg.get('domain_profiles', [])) >= 5, 'Expected >= 5 AI domain profiles'

          # 3. Validate all Kestra YAML workflows & PostgreSQL init sequence
          try:
              import yaml
          except ImportError:
              yaml = None

          expected_flows = [
              'unirequest-lifecycle',
              'unirequest-sla-watchdog',
              'unirequest-daily-report',
          ]
          flow_files = sorted(glob.glob('config/kestra/flows/*.yml'))
          assert len(flow_files) >= len(expected_flows), 'Missing Kestra YAML workflow files'
          found_ids = set()
          for fp in flow_files:
              flow_text = open(fp, encoding='utf-8').read()
              if yaml is not None:
                  parsed = yaml.safe_load(flow_text)
                  assert isinstance(parsed, dict), f'Invalid YAML object in {fp}'
                  assert parsed.get('namespace') == 'unirequest.dxos', f'Wrong namespace in {fp}'
                  found_ids.add(parsed.get('id'))
              else:
                  assert 'namespace: unirequest.dxos' in flow_text, f'Missing namespace in {fp}'
                  m = re.search(r'^id:\s*(\S+)', flow_text, re.M)
                  assert m, f'Missing id in {fp}'
                  found_ids.add(m.group(1))
          for eid in expected_flows:
              assert eid in found_ids, f'Missing expected Kestra flow id: {eid}'

          sql_files = sorted(glob.glob('config/postgres/init/*'))
          assert len(sql_files) >= 10, f'Expected >= 10 Postgres init scripts, found {len(sql_files)}'

          # 4. Validate all SVG files are well-formed XML
          svgs = sorted(glob.glob('docs/images/*.svg'))
          assert len(svgs) >= 2, 'Expected SVG diagrams in docs/images/'
          for svg in svgs:
              ET.parse(svg)

          # 5. Verify all relative image/file links in README.md and tracked docs/**/*.md exist
          md_files = ['README.md'] + sorted(
              p for p in glob.glob('docs/**/*.md', recursive=True)
              if not p.startswith('docs/specs/')
              and os.path.basename(p) not in {'DevOops.md', 'KEHOACH.md', 'TichHopDuAn.md', 'TongQuanDuAn.md'}
          )
          for doc in md_files:
              base_dir = os.path.dirname(doc) or '.'
              content = open(doc, encoding='utf-8').read()
              paths = re.findall(r'(?:src|srcset)="([^"]+)"|\]\(([^)#]+)\)', content)
              for a, b in paths:
                  p = a or b
                  if p.startswith('http') or p.startswith('mailto:') or p.startswith('#'):
                      continue
                  resolved = os.path.normpath(os.path.join(base_dir, p))
                  assert os.path.exists(resolved), f'Broken link in {doc}: {p} -> {resolved}'

          print('ALL INFRA & OPEN-SOURCE COMPLIANCE CHECKS PASSED!')
          PY

      - name: Validate Shell Scripts Syntax
        run: |
          sh -n kong-setup.sh
          sh -n scripts/kestra-setup.sh
          bash -n scripts/test-e2e.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n scripts/internet-demo.sh
          bash -n scripts/release.sh
