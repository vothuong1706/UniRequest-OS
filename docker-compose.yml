services:
  postgres:
    image: postgres:16-alpine
    container_name: unirequest-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/postgres/data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: unirequest-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JAVA_OPTS_APPEND: "-Xms192m -Xmx512m"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  kong-db:
    image: postgres:16-alpine
    container_name: unirequest-kong-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KONG_PG_DB}
      POSTGRES_USER: ${KONG_PG_USER}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD}
    volumes:
      - ./config/kong/db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_PG_USER} -d ${KONG_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migration:
    image: kong:3.7.1
    container_name: unirequest-kong-migration
    command: kong migrations bootstrap
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
    depends_on:
      kong-db:
        condition: service_healthy
    restart: on-failure

  kong:
    image: kong:3.7.1
    container_name: unirequest-kong
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_NGINX_WORKER_PROCESSES: "2"
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      kong-migration:
        condition: service_completed_successfully

  kong-init:
    image: curlimages/curl:8.11.1
    container_name: unirequest-kong-init
    environment:
      KONG_ADMIN_URL: http://kong:8001
    volumes:
      - ./kong-setup.sh:/kong-setup.sh:ro
    entrypoint: ["sh", "/kong-setup.sh"]
    depends_on:
      kong:
        condition: service_healthy
    restart: "no"

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: unirequest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/minio/data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "9001:9001"

  kestra:
    image: kestra/kestra:v2.0.11
    container_name: unirequest-kestra
    restart: unless-stopped
    user: "root"
    command: server standalone
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JAVA_OPTS: "-Xms192m -Xmx512m -Duser.timezone=${TZ:-Asia/Ho_Chi_Minh}"
      ENV_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      ENV_DB_USER: "${POSTGRES_USER}"
      ENV_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      ENV_MINIO_ENDPOINT: "http://minio:9000"
      ENV_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      ENV_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      ENV_BACKEND_URL: "http://backend:4000"
      ENV_WEBHOOK_KEY: "${KESTRA_WEBHOOK_KEY}"
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_BASIC_AUTH_USER}
              password: ${KESTRA_BASIC_AUTH_PASSWORD}
              open-urls:
                - "/ping"
                - "/api/v1/executions/webhook/**"
                - "/api/v1/main/executions/webhook/**"
          tutorial-flows:
            enabled: false
          anonymous-usage-report:
            enabled: false
    volumes:
      - kestra-storage:/app/storage
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy

  kestra-init:
    image: curlimages/curl:8.11.1
    container_name: unirequest-kestra-init
    environment:
      KESTRA_URL: http://kestra:8080
      FLOWS_DIR: /flows
      KESTRA_BASIC_AUTH_USER: ${KESTRA_BASIC_AUTH_USER}
      KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD}
    volumes:
      - ./scripts/kestra-setup.sh:/kestra-setup.sh:ro
      - ./config/kestra/flows:/flows:ro
    entrypoint: ["sh", "/kestra-setup.sh"]
    depends_on:
      kestra:
        condition: service_started
    restart: "no"

  backend:
    build:
      context: ./apps/backend-api
      dockerfile: Dockerfile
    container_name: unirequest-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PORT: 4000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      KEYCLOAK_REALM_URL: http://keycloak:8080/auth/realms/unirequest
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: unirequest
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: unirequest-files
      MINIO_PUBLIC_URL: /api/upload/files
      KESTRA_ENABLED: "true"
      KESTRA_URL: http://kestra:8080
      KESTRA_NAMESPACE: unirequest.dxos
      KESTRA_FLOW_ID: unirequest-lifecycle
      KESTRA_WEBHOOK_KEY: ${KESTRA_WEBHOOK_KEY}
      KESTRA_BASIC_AUTH_USER: ${KESTRA_BASIC_AUTH_USER}
      KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@unirequest.edu.vn}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ATTACHMENT_SIGNING_SECRET: ${ATTACHMENT_SIGNING_SECRET:-}
      ATTACHMENT_SIGNED_URL_TTL_SECONDS: ${ATTACHMENT_SIGNED_URL_TTL_SECONDS:-3600}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DATA_FILE: ${SEED_DATA_FILE:-/usr/src/app/seed/demo-data.json}
      AI_ENABLED: ${AI_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
      AI_CONFIG_FILE: ${AI_CONFIG_FILE:-/usr/src/app/ai-config/assistant-config.json}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALERT_TO: ${SMTP_ALERT_TO:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ./config/seed:/usr/src/app/seed:ro
      - ./config/ai:/usr/src/app/ai-config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
      kestra:
        condition: service_started

  frontend:
    build:
      context: ./apps/demo-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: auto
        VITE_KEYCLOAK_URL: auto
        VITE_KEYCLOAK_REALM: unirequest
        VITE_KEYCLOAK_CLIENT_ID: unirequest-portal
    container_name: unirequest-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3000:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: unirequest-caddy
    profiles: ["internet"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  kestra-storage:
  caddy-data:
  caddy-config:
