map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_host $host_port {
    ~^[^:]+:(\d+)$ $1;
    default "";
}

map $forwarded_proto:$host_port $computed_port {
    ~^https:$ 443;
    ~^https:(\d+)$ $1;
    ~^http:(\d+)$ $1;
    default 80;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    '' $computed_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Nén gzip cho tài nguyên tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chặn hoàn toàn mọi truy cập bên ngoài tới các endpoint nội bộ (/api/internal/*, không phân biệt hoa/thường)
    location ~* ^/api/+internal(/|$) {
        return 403;
    }

    # Same-Origin Proxy tới Kong API Gateway (/api + Socket.IO WebSocket Upgrade)
    location /api/ {
        set $kong_upstream http://kong:8000;
        proxy_pass $kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 86400s;
    }

    # Same-Origin Proxy tới Keycloak SSO qua Kong (/auth)
    location /auth/ {
        set $kong_upstream http://kong:8000;
        proxy_pass $kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Cache lâu dài cho assets đã hash của Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Không cache index.html, Service Worker và Web Manifest để trình duyệt luôn nhận bản mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # SPA fallback: mọi đường dẫn đều trỏ về index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Endpoint health check nhẹ cho Docker / load balancer
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }
}
